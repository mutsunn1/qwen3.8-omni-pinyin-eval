name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + offline tests (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Sync environment (locked)
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check src tests

      - name: Pytest (offline, no API key / no audio downloads)
        run: uv run pytest -q
