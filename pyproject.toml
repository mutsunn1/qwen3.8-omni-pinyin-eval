[project]
name = "pinyin-eval"
version = "0.1.0"
description = "Qwen3.8-Omni Mandarin pinyin (initial/final/tone) recognition & consistency-detection benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=0.34",
    "numpy>=2.1",
    "openai>=1.52",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
pinyin-eval = "pinyin_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinyin_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that reach the network (deselected by default if requested)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
